<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药品说明书智能对比助手</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 强制隐藏加载层，防止卡死 */
        #loading-layer { display: none !important; }
        body { font-family: sans-serif; padding: 20px; }
    </style>
</head>
<body>

    <!-- 这里是你原本的页面内容结构 -->
    <div id="app">
        <h1>药品说明书智能对比助手</h1>
        <p>请在下方输入药品名称或上传文件...</p>
        
        <!-- 模拟原本的输入区域，确保页面有内容 -->
        <div style="margin-top: 20px; border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
            <h3>药品 A</h3>
            <textarea style="width: 100%; height: 100px;" placeholder="输入药品A说明书..."></textarea>
            
            <h3 style="margin-top: 20px;">药品 B</h3>
            <textarea style="width: 100%; height: 100px;" placeholder="输入药品B说明书..."></textarea>
            
            <button style="margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px;">开始对比</button>
        </div>
    </div>

    <!-- 注意：这里我已经删除了 <script src="app.js"></script> -->
    
    <!-- 这是一个简单的内置脚本，用来确保页面不再转圈 -->
    <script>
        console.log("页面加载成功，已移除 app.js 引用");
        // 如果页面还有转圈的动画，强制移除它
        const loaders = document.querySelectorAll('.loading, .spinner, #loading');
        loaders.forEach(el => el.style.display = 'none');
    </script>
</body>
</html>
