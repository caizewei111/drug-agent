<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药品说明书智能对比助手</title>
    <!-- 引入样式表 -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 简单的加载动画样式，确保在 app.js 加载前也能看到 */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 初始加载遮罩 (app.js 加载完成后会自动隐藏它) -->
    <div id="initial-loading" class="loading-overlay">
        <div class="spinner"></div>
        <p>正在初始化应用...</p>
    </div>

    <div class="container">
        <header>
            <h1>💊 药品说明书智能对比助手</h1>
            <div class="settings-btn" onclick="toggleSettings()">⚙️ 设置</div>
        </header>

        <!-- 设置面板 -->
        <div id="settings-panel" class="settings-panel" style="display:none;">
            <div class="form-group">
                <label>API Key (通义千问/DeepSeek等):</label>
                <input type="password" id="api-key" placeholder="sk-..." />
            </div>
            <div class="form-group">
                <label>API 地址 (Base URL):</label>
                <input type="text" id="api-base" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1" />
            </div>
            <div class="form-group">
                <label>模型名称:</label>
                <input type="text" id="model-name" placeholder="qwen-plus" />
            </div>
            <button onclick="saveSettings()" class="btn-primary">保存配置</button>
        </div>

        <main>
            <div class="input-section">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('text')">📝 文本输入</button>
                    <button class="tab-btn" onclick="switchTab('file')">📂 文件上传</button>
                </div>

                <!-- 文本输入模式 -->
                <div id="text-input-mode" class="input-mode">
                    <div class="drug-inputs">
                        <div class="drug-box">
                            <h3>药品 A 说明书</h3>
                            <textarea id="drug-a-text" placeholder="请粘贴药品A的说明书全文..."></textarea>
                        </div>
                        <div class="drug-box">
                            <h3>药品 B 说明书</h3>
                            <textarea id="drug-b-text" placeholder="请粘贴药品B的说明书全文..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- 文件上传模式 -->
                <div id="file-input-mode" class="input-mode" style="display:none;">
                    <div class="drug-inputs">
                        <div class="drug-box">
                            <h3>药品 A 文件</h3>
                            <input type="file" id="drug-a-file" accept=".txt,.md,.json" />
                            <div id="file-a-status" class="status-msg"></div>
                        </div>
                        <div class="drug-box">
                            <h3>药品 B 文件</h3>
                            <input type="file" id="drug-b-file" accept=".txt,.md,.json" />
                            <div id="file-b-status" class="status-msg"></div>
                        </div>
                    </div>
                </div>

                <div class="action-area">
                    <button id="compare-btn" class="btn-large" onclick="startComparison()">
                        🚀 开始智能对比
                    </button>
                </div>
            </div>

            <!-- 结果展示区 -->
            <div id="result-section" class="result-section" style="display:none;">
                <h2>📊 对比分析报告</h2>
                <div id="loading-indicator" class="loading-state" style="display:none;">
                    <div class="spinner"></div>
                    <p>智能体正在深度分析两份说明书，请稍候......</p>
                </div>
                <div id="analysis-result" class="markdown-body">
                    <!-- 分析结果将在这里显示 -->
                </div>
            </div>
        </main>
    </div>

    <!-- 核心逻辑脚本 -->
    <script src="app.js"></script>

</body>
</html>
